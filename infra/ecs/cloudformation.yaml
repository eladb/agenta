AWSTemplateFormatVersion: '2010-09-09'
# CloudFormation caps Description at 1024 chars (rendered, not YAML source).
# Keep edits below that ceiling -- run `python3 -c "import yaml; ..."` on
# the rendered string after major rewrites to verify.
Description: >-
  agenta bot ECS Fargate deployment (phase 1, agenta #208). Single Fargate
  task, public subnet + public IP, no NAT, no ALB; bot is Socket-Mode +
  outbound HTTPS only (Slack WS, model gateway, Fly Machines API for
  sandbox provisioning). EFS for /data so atomic rename works for
  session.json + sandbox state. Singleton enforced via deployment config
  (minHealthyPercent=0, maxPercent=100) so the bot's own lockfile
  (src/lockfile.ts) never sees two processes racing. Secrets come from
  SSM Parameter Store (SecureString) under /<SsmParameterPrefix>/<NAME>,
  injected via the task definition's `secrets:` block (no env-file
  shipping, no AWS Secrets Manager surcharge). Operator populates them
  once with `aws ssm put-parameter` -- see infra/ecs/README.md. ECR repo
  and CloudWatch log group are created here so the stack bootstraps
  everything an empty AWS account needs. scripts/deploy-bot-ecs.ts
  builds, pushes both <sha> and :latest tags, registers a new task-def
  revision pinned to the SHA, and force-rolls the service.

Parameters:
  ClusterName:
    Type: String
    Default: agenta-bot
    Description: Name of the ECS cluster created for the bot.

  ServiceName:
    Type: String
    Default: agenta-bot
    Description: Name of the ECS service running the bot task.

  EcrRepositoryName:
    Type: String
    Default: agenta-bot
    Description: ECR repository name that holds the bot image.

  LogGroupName:
    Type: String
    Default: /ecs/agenta-bot
    Description: CloudWatch Logs group for the bot task.

  SsmParameterPrefix:
    Type: String
    Default: /agenta-bot
    Description: >
      Path prefix (no trailing slash) under which the bot's secrets live in
      SSM Parameter Store as SecureString parameters. e.g. with the default,
      MODEL_API_KEY lives at /agenta-bot/MODEL_API_KEY.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC the Fargate task and EFS will run in.

  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      One or more public subnets (with a route to an Internet Gateway).
      Task gets a public IP for egress; there is no inbound surface.

  ImageTag:
    Type: String
    Default: latest
    Description: >
      ECR image tag the task definition pins. Override per-deploy via
      `aws cloudformation deploy --parameter-overrides ImageTag=<sha>` or
      let scripts/deploy-bot-ecs.ts register a new revision out-of-band.

  TaskCpu:
    Type: String
    Default: '256'
    Description: Fargate vCPU units (256 = 0.25 vCPU).
    AllowedValues: ['256', '512', '1024', '2048', '4096']

  TaskMemory:
    Type: String
    Default: '1024'
    Description: Fargate memory in MB (1024 = 1 GB; matches Fly).
    AllowedValues: ['512', '1024', '2048', '3072', '4096', '5120', '6144', '7168', '8192']

  AgentaSandboxApp:
    Type: String
    Default: agenta-sandbox
    Description: >
      Fly app name that hosts per-thread sandbox machines. The bot stays
      on SANDBOX_PROVIDER=fly even when deployed on ECS - sandboxes still
      live on Fly. Injected as AGENTA_SANDBOX_APP.

  FlyRegion:
    Type: String
    Default: iad
    Description: Fly region for per-thread sandbox machines/volumes (injected as FLY_REGION).

  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1
    Description: >-
      ECS service desired task count. The bot's src/lockfile.ts is a hard
      singleton: >1 simply will not boot. Default 0 so the first stack
      apply against an empty ECR + empty SSM does not crashloop pulling
      a missing image; bump to 1 (re-deploy or `aws ecs update-service
      --desired-count 1`) after the image is pushed and SSM is populated.

Resources:
  # -- ECR --------------------------------------------------------------
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref EcrRepositoryName
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true

  # -- Logs -------------------------------------------------------------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      RetentionInDays: 30

  # -- EFS for /data (persistent across task replacements) --------------
  # Mounted at /data inside the container. The access point pins the
  # POSIX uid/gid to root (0/0) for parity with Fly's volume behavior;
  # the bot's threat model is "trusted code with secrets" so container
  # uid isn't the security boundary - see issue #208.
  EfsFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      FileSystemTags:
        - Key: Name
          Value: !Sub '${ServiceName}-data'

  EfsAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref EfsFileSystem
      PosixUser:
        Uid: '0'
        Gid: '0'
      RootDirectory:
        Path: /data
        CreationInfo:
          OwnerUid: '0'
          OwnerGid: '0'
          Permissions: '0755'

  # One mount target per public subnet. ECS task ENIs in the same subnet
  # use the local mount target for NFSv4 traffic over EFS SG.
  EfsMountTarget0:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EfsFileSystem
      SubnetId: !Select [0, !Ref PublicSubnetIds]
      SecurityGroups:
        - !Ref EfsSecurityGroup

  # -- Security groups --------------------------------------------------
  # The bot task: no ingress at all (no ALB, no public service). All
  # egress allowed - bot talks to Slack WS, model gateway, Fly Machines
  # API, EFS, ECR, CloudWatch Logs, SSM, all over HTTPS / NFS.
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: agenta bot Fargate task - egress only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: All egress (Slack WS, model gateway, Fly API, ECR, EFS, CWL, SSM)

  # EFS SG only accepts NFS (2049) from the task SG. No other source.
  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: agenta bot EFS - NFS from task SG only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: All egress (NFS replies)

  EfsIngressFromTask:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EfsSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      Description: NFS from bot task SG

  # -- IAM --------------------------------------------------------------
  # Execution role: ECS agent uses this to pull the image, write logs,
  # and read SSM parameters BEFORE the container starts (for secrets
  # injection).
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadSsmSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameters
                  - ssm:GetParameter
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}/*'
              # SSM SecureString parameters are encrypted with the AWS-managed
              # KMS key by default - Decrypt against that key is required for
              # the execution role to actually read them.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/aws/ssm'

  # Task role: what the bot process itself can do at runtime. Only EFS
  # access - the bot talks to Fly / Slack / model gateway with the tokens
  # it gets from SSM, not via AWS APIs.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EfsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                  - elasticfilesystem:ClientRootAccess
                Resource: !GetAtt EfsFileSystem.Arn
                Condition:
                  StringEquals:
                    elasticfilesystem:AccessPointArn: !GetAtt EfsAccessPoint.Arn
        # ECS sandbox provider (phase 2, #213 / #218). The bot shells out
        # to `aws ecs run-task` etc. against a SEPARATE sandbox cluster.
        # No EFS access-point perms here — the post-#218 design mounts a
        # shared EFS root + per-thread subdir, no per-thread access points.
        # TODO: tighten Resource to sandbox stack ARNs once cross-stack
        # outputs are wired through.
        - PolicyName: EcsSandboxProvider
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:RunTask
                  - ecs:StopTask
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:DescribeServices
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:DescribeNetworkInterfaces
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  # -- Cluster + task + service -----------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn:
      - EfsMountTarget0
    Properties:
      Family: !Ref ServiceName
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - Name: data
          EFSVolumeConfiguration:
            FilesystemId: !Ref EfsFileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref EfsAccessPoint
              IAM: ENABLED
      ContainerDefinitions:
        - Name: bot
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepositoryName}:${ImageTag}'
          Essential: true
          # Mirrors the Dockerfile HEALTHCHECK so ECS actually surfaces
          # `healthStatus` on the task (without this block the task stays
          # UNKNOWN forever and the deployment circuit breaker has no
          # signal). CMD-SHELL is required for the ${HEALTH_PORT:-8080}
          # shell expansion -- the CMD form skips the shell.
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -fsS "http://localhost:${HEALTH_PORT:-8080}/health" || exit 1
            Interval: 30
            Timeout: 5
            StartPeriod: 30
            Retries: 3
          # No PortMappings -- nothing inbound.
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: bot
          MountPoints:
            - SourceVolume: data
              ContainerPath: /data
              ReadOnly: false
          # Plain env - matches the Fly [env] block in fly.toml so the
          # only delta between deployments is the secret source.
          Environment:
            - Name: AGENTA_DATA_DIR
              Value: /data/agenta
            - Name: AGENT_HOMES_ROOT
              Value: /data/homes
            - Name: AGENTA_SANDBOX_APP
              Value: !Ref AgentaSandboxApp
            - Name: SANDBOX_PROVIDER
              Value: fly
            - Name: FLY_REGION
              Value: !Ref FlyRegion
            - Name: HEALTH_PORT
              Value: '8080'
          # Secrets pulled from SSM Parameter Store at task start. Each
          # entry maps to /<SsmParameterPrefix>/<NAME>. Populate via:
          #   aws ssm put-parameter --type SecureString --name /agenta-bot/MODEL_API_KEY --value ...
          # FLY_API_TOKEN is required because the bot still provisions
          # sandboxes against the Fly Machines API even when running on
          # ECS (SANDBOX_PROVIDER=fly).
          Secrets:
            # Slack credentials (Socket Mode + Web API).
            - Name: SLACK_APP_TOKEN
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}/SLACK_APP_TOKEN'
            - Name: SLACK_BOT_TOKEN
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}/SLACK_BOT_TOKEN'
            # Model gateway: OpenAI-compat endpoint + key + per-channel
            # Bedrock override credential (referenced from config/homes.json).
            - Name: MODEL_API_KEY
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}/MODEL_API_KEY'
            - Name: MODEL_BASE_URL
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}/MODEL_BASE_URL'
            - Name: MODEL_NAME
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}/MODEL_NAME'
            - Name: AWS_BEARER_TOKEN_BEDROCK
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}/AWS_BEARER_TOKEN_BEDROCK'
            # Home-repo auth (referenced from config/homes.json's
            # auth_env entries). GITHUB_TOKEN = HTTPS PAT for the default
            # home; the *_DEPLOY_KEY entries are PEM-formatted SSH keys
            # for direct-mode home repos.
            - Name: GITHUB_TOKEN
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}/GITHUB_TOKEN'
            - Name: AGENTA_TEST_HOME_ALONE_DEPLOY_KEY
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}/AGENTA_TEST_HOME_ALONE_DEPLOY_KEY'
            - Name: SALTO_SALESFORCE_PLAYGROUND_DEPLOY_KEY
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}/SALTO_SALESFORCE_PLAYGROUND_DEPLOY_KEY'
            # Tool credentials: salto_* tools shell out to salto-cloud,
            # web_search hits the Tavily API.
            - Name: SALTO_API_TOKEN
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}/SALTO_API_TOKEN'
            - Name: TAVILY_API_KEY
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}/TAVILY_API_KEY'
            # Sandbox provider: bot stays on Fly for per-thread sandboxes
            # even when itself on ECS.
            - Name: FLY_API_TOKEN
              ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}/FLY_API_TOKEN'

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - EfsMountTarget0
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      # Singleton - stop the old task BEFORE starting the new one so the
      # bot's lockfile (src/lockfile.ts) never sees two processes against
      # the same EFS volume.
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Public IP only for egress (no ALB, no inbound). Avoids the
          # ~$32/mo NAT Gateway tax - see issue #208 cost table.
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups:
            - !Ref TaskSecurityGroup

Outputs:
  ClusterArn:
    Description: ECS cluster ARN
    Value: !GetAtt Cluster.Arn

  ServiceArn:
    Description: ECS service ARN
    Value: !Ref Service

  TaskDefinitionArn:
    Description: Current task definition ARN
    Value: !Ref TaskDefinition

  EcrRepositoryUri:
    Description: ECR repo URI for `docker push`
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepositoryName}'

  EfsFileSystemId:
    Description: EFS filesystem id backing /data
    Value: !Ref EfsFileSystem

  LogGroupName:
    Description: CloudWatch log group for the bot
    Value: !Ref LogGroup

  SsmParameterPrefix:
    Description: SSM Parameter Store prefix the task pulls secrets from
    Value: !Ref SsmParameterPrefix
