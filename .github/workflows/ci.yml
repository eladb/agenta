name: CI

# Pre-merge gate on PRs only. CD runs the same unit-test step post-merge
# on main, so duplicating it here is just noise. Unit tests only — e2e
# tests need real Slack tokens and would deadlock on Socket Mode
# contention; they live in `cd.yml` and run post-merge.
#
# Doc-only PRs skip the work but the job still completes green so branch
# protection's required `unit-tests` check is satisfied. The allowlist
# of skip-paths lives in `.ci-ignore` at the repo root.

on:
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # detect-code-changes diffs PR base..head; needs the full
          # history. Also lets the composite action's action.yml load.
          fetch-depth: 0

      - name: Detect code changes
        id: changed
        uses: ./.github/actions/detect-code-changes

      - uses: oven-sh/setup-bun@v2
        if: steps.changed.outputs.code == 'true'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.changed.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Build bot image (sanity check Dockerfile)
        if: steps.changed.outputs.code == 'true'
        run: docker build -t agenta-bot:ci .

      - name: Unit tests
        if: steps.changed.outputs.code == 'true'
        run: bun test src

      - name: Doc-only — tests skipped
        if: steps.changed.outputs.code == 'false'
        run: echo "Only doc-allowlisted paths changed; skipping bun install + docker build + tests."
