name: CI

# Pre-merge gate. Runs on every PR + on every push to main (so the badge
# stays current even on direct pushes). Unit tests only — e2e tests need
# real Slack tokens and would deadlock on Socket Mode contention; they
# live in `e2e-prod.yml` and run post-merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build bot image (sanity check Dockerfile)
        run: docker build -t agenta-bot:ci .

      - name: Unit tests
        run: bun test src
