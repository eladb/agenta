name: CD (ECS)

# Parallel CD lane: deploy the salto bot to AWS ECS Fargate on every push
# to main, alongside the Fly lane (`cd.yml`). See issue #229.
#
#   1. Deploy bot image — scripts/deploy-bot-ecs.ts builds the repo-root
#      Dockerfile, pushes :<sha> + :latest to ECR, registers a new
#      task-def revision, rolls the agenta-bot service, and polls to
#      steady state.
#   2. Deploy sandbox image — scripts/deploy-sandbox-ecs.ts builds the
#      sandbox/ Dockerfile + pushes to ECR. Gated on sandbox/** changes
#      so unrelated merges don't rebuild it. No service to roll — the bot
#      pulls :latest on the next per-thread RunTask.
#   3. Canary — scripts/canary.ts (AGENTA_DEPLOY_TARGET=ecs) preflights via
#      `aws ecs describe-services`, then the 3-step Slack smoke test (chat
#      → bash → /delete) against the deployed salto bot.
#
# No e2e in this lane. e2e with SANDBOX_PROVIDER=ecs can't run from a
# GitHub-hosted runner: the ECS sandbox provider resolves the task's
# PRIVATE VPC IP and the in-process agent dials http://<private-ip>:9000
# (src/sandbox/ecs.ts), which a runner outside the VPC can't reach (the
# sandbox SG only admits the bot SG). Code correctness is already covered
# by cd.yml's e2e on the identical image; the canary here validates the
# ECS sandbox path end-to-end because the *deployed* salto bot (in-VPC) is
# what spawns the Fargate sandbox.
#
# The canary uses a DEDICATED tester app (ECS_TEST_*) — NOT the shared
# tester (TEST_*) that cd.yml's canary connects. Slack Socket Mode
# load-balances events across every client on the same app token, so
# reusing the shared tester would split events 50/50 when both lanes'
# canaries overlap on a merge. A dedicated app lets this lane run truly in
# parallel with cd.yml.
#
# Doc-only commits skip every deploy step (same .ci-ignore allowlist as
# cd.yml) but the workflow still completes green. Manual rollback is via
# `aws ecs update-service` to a prior task-def revision.

on:
  push:
    branches: [main]

concurrency:
  # Own group, separate from cd.yml's `cd` — the two lanes run in parallel.
  # Queue runs instead of cancelling: a follow-on doc-only push no-ops, but
  # cancelling an in-flight real deploy could leave ECS on the old image.
  group: cd-ecs
  cancel-in-progress: false

jobs:
  cd-ecs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ubuntu-latest ships aws CLI v2 + docker preinstalled; the bun deploy
    # scripts shell out to `aws`/`docker` and resolve creds via the standard
    # chain (these env vars). Region is a plain env, not a secret.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
        with:
          # detect-code-changes (and the sandbox diff below) compare
          # before..after; need full history.
          fetch-depth: 0

      - name: Detect code changes
        id: changed
        uses: ./.github/actions/detect-code-changes

      - uses: oven-sh/setup-bun@v2
        if: steps.changed.outputs.code == 'true'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.changed.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Deploy bot image to ECS
        if: steps.changed.outputs.code == 'true'
        env:
          AGENTA_ECS_CLUSTER: agenta-bot
          AGENTA_ECS_SERVICE: agenta-bot
        run: bun scripts/deploy-bot-ecs.ts

      # Gate the sandbox image rebuild on sandbox/** changes so unrelated
      # merges don't pay the build+push cost. Resolve base/head like
      # detect-code-changes does: zero-sha / empty before → parent of head.
      - name: Detect sandbox changes
        id: sandbox
        if: steps.changed.outputs.code == 'true'
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          head="${{ github.sha }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ] || [ -z "$before" ]; then
            base="$(git rev-parse "${head}^" 2>/dev/null || echo "")"
          else
            base="$before"
          fi
          if [ -z "$base" ]; then
            echo "Could not resolve base — rebuilding sandbox image to be safe." >&2
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparing $base...$head for sandbox/ changes"
          files=$(git diff --name-only "$base" "$head" -- 'sandbox/**' || true)
          echo "Changed sandbox files:"
          echo "${files:-(none)}" | sed 's/^/  /'
          if [ -n "$files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy sandbox image to ECS
        if: steps.changed.outputs.code == 'true' && steps.sandbox.outputs.changed == 'true'
        env:
          AGENTA_ECS_SANDBOX_CLUSTER: agenta-sandbox
        run: bun scripts/deploy-sandbox-ecs.ts

      # Canary uses the salto bot token only to resolve the salto bot's user
      # id (no Socket Mode client connects to it). The DEDICATED ECS tester
      # (ECS_TEST_*) drives the conversation, so this runs in parallel with
      # cd.yml's canary without splitting the shared tester's Socket Mode.
      - name: Canary (salto / ECS)
        if: steps.changed.outputs.code == 'true'
        env:
          AGENTA_DEPLOY_TARGET: ecs
          AGENTA_ECS_CLUSTER: agenta-bot
          AGENTA_ECS_SERVICE: agenta-bot
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TEST_APP_TOKEN: ${{ secrets.ECS_TEST_APP_TOKEN }}
          TEST_BOT_TOKEN: ${{ secrets.ECS_TEST_BOT_TOKEN }}
          TEST_CHANNEL_ID: ${{ secrets.SALTO_CANARY_CHANNEL_ID }}
        run: bun run canary

      - name: Doc-only — CD skipped
        if: steps.changed.outputs.code == 'false'
        run: echo "Only doc-allowlisted paths changed; skipping ECS deploy + canary."
