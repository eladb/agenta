name: CD

# Test-only pipeline. Runs on push to main.
#
# Since the agenta Fly deployment was torn down (2026-06-02), there is no
# longer any prod app to deploy or canary. CD now runs only the e2e suite.
# The salto/ECS deployment lives in its own repo (salto-io/slack-agent,
# #267) with its own OIDC CD — it never deployed from here.
#
#   e2e — full tests/e2e/ suite, on the docker sandbox provider
#         (ubuntu-latest ships Docker, so dockerProvider runs locally on
#         the runner — this also exercises the ~13 docker-gated sandbox
#         test cases that the old fly-provider run skipped). The
#         in-process agent uses the DEDICATED `agenta-ci` Slack app
#         (CI_SLACK_*), not any production agent app. Slack Socket Mode
#         load-balances events between every client connected on the same
#         app token, so a shared token would route ~half its events to the
#         runner during the test window — the CI app has its own
#         connection, zero contention. The tester bot (TEST_*) is the
#         puppet driving the channel.
#
# A red e2e step fails the workflow; the default GitHub Actions failure
# email is the alarm. (No deploy/canary steps any more, so no
# deploy-only regression to catch and no manual-rollback path.)
#
# Doc-only commits skip e2e but the workflow still completes green so the
# timeline stays clean. The skip allowlist lives in `.ci-ignore` at the
# repo root.
#
# Prod-only changes (config/tenants.json, slack-manifests, etc.) also skip
# e2e via `.ci-e2e-ignore` — e2e wouldn't exercise those paths anyway
# (helpers.ts mints an inline tenants config per run; the test Slack apps
# are separate). With deploy/canary gone these commits now no-op entirely,
# but the tier is harmless and left in place (reworking change-detection is
# a separate concern).
#
# Concurrency: serialize runs AND preempt in-flight runs when a newer
# commit lands — only one agenta-ci Socket Mode client at a time, else two
# CI runs would split events 50/50.

on:
  push:
    branches: [main]

concurrency:
  group: cd
  # Queue runs instead of cancelling so two agenta-ci Socket Mode clients
  # never overlap and split events 50/50.
  cancel-in-progress: false

jobs:
  cd:
    runs-on: ubuntu-latest
    # e2e only — no deploy/canary since the Fly deployment was torn down.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # detect-code-changes diffs push before..after; needs the full
          # history. Also lets the composite action's action.yml load.
          fetch-depth: 0

      - name: Detect code changes
        id: changed
        uses: ./.github/actions/detect-code-changes

      - uses: oven-sh/setup-bun@v2
        if: steps.changed.outputs.code == 'true'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.changed.outputs.code == 'true'
        run: bun install --frozen-lockfile

      # The in-process e2e agent gets its home config via
      # `tests/e2e/helpers.ts:setupTempDataDir`, which installs a
      # `withTempHomeConfig(file://<tmpdir>)` per test — no env-var clone
      # needed any more (#87 dropped the AGENT_HOME single-repo env).

      - name: E2E
        if: steps.changed.outputs.e2e_relevant == 'true'
        env:
          # Dedicated CI Slack app — see header comment for why.
          SLACK_APP_TOKEN: ${{ secrets.CI_SLACK_APP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          TEST_APP_TOKEN: ${{ secrets.TEST_APP_TOKEN }}
          TEST_BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          # Docker sandbox provider — ubuntu-latest ships Docker, so
          # dockerProvider runs locally on the runner. This also exercises
          # the docker-gated sandbox test cases that skip cleanly via
          # `test.if(DOCKER_PROVIDER_ACTIVE)` under other providers.
          SANDBOX_PROVIDER: docker
        run: bun run e2e

      - name: Prod-only change — E2E skipped
        if: steps.changed.outputs.code == 'true' && steps.changed.outputs.e2e_relevant == 'false'
        run: echo "Only .ci-e2e-ignore-allowlisted paths changed; skipping e2e."

      - name: Doc-only — CD skipped
        if: steps.changed.outputs.code == 'false'
        run: echo "Only doc-allowlisted paths changed; skipping e2e."
