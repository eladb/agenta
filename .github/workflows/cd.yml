name: CD

# Post-merge deploy + smoke. Runs on push to main, sequentially after
# e2e-prod.yml (which now runs against the dedicated agenta-ci Slack
# app — see that workflow's header).
#
#   1. deploy — `bun run deploy` (scripts/deploy-bot-fly.ts) rolls the
#              agenta-bot Fly machine to the new image.
#   2. canary — scripts/canary.ts against the just-deployed production
#              bot using the tester credentials. Mentions the prod agent
#              user via Slack and asserts chat reply + bash + /delete.
#              Catches deploy-only regressions (env, image, fly volume).
#
# Why this is separate from e2e-prod.yml: e2e exercises the in-process
# source against a CI Slack app; this workflow validates the actually-
# deployed Fly machine. Both signals are useful but answer different
# questions.
#
# A red canary fails the workflow — the default GitHub Actions failure
# email is the alarm. Manual rollback is
# `flyctl releases rollback -a agenta-bot`.
#
# Concurrency: serialize runs without cancelling so a burst of pushes
# to main doesn't interleave deploys.

on:
  push:
    branches: [main]

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  cd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to production
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: bun run deploy

      # Canary uses the production agent's bot token only to resolve the
      # prod agent's user id (no Socket Mode client is connected to it).
      # The tester drives the conversation via TEST_APP_TOKEN/TEST_BOT_TOKEN.
      - name: Canary (production)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TEST_APP_TOKEN: ${{ secrets.TEST_APP_TOKEN }}
          TEST_BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}
          TEST_CHANNEL_ID: ${{ secrets.CANARY_CHANNEL_ID }}
        run: bun run canary
