name: CD

# Gated deploy pipeline. Runs on push to main.
#
#   1. e2e   — full tests/e2e/ suite. The in-process agent uses the
#              DEDICATED `agenta-ci` Slack app (CI_SLACK_*), not the
#              production agent app. Slack Socket Mode load-balances
#              events between every client connected on the same app
#              token, so reusing prod's token would route ~half of
#              prod's events to the runner during the test window —
#              the CI app has its own connection, zero contention. The
#              tester bot (TEST_*) is the puppet driving the channel.
#   2. deploy — `bun run deploy` (scripts/deploy-bot-fly.ts) only if
#              e2e is green. Rolls the agenta-bot Fly machine to the
#              new image.
#   3. canary — scripts/canary.ts mentions the just-deployed prod bot
#              via the tester and asserts chat reply + bash + /delete.
#              Catches deploy-only regressions (env, image, fly volume)
#              that e2e against the runner can't.
#
# A red step fails the workflow — prod never sees code that didn't pass
# e2e, and the default GitHub Actions failure email is the alarm if
# canary regresses after a deploy. Manual rollback is
# `flyctl releases rollback -a agenta-bot`.
#
# Concurrency: serialize runs without cancelling. Two reasons —
# (a) only one agenta-ci Socket Mode client at a time, else two CI
# runs would split events 50/50, and (b) interleaved deploys would
# race each other.

on:
  push:
    branches: [main]

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  cd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pre-build the sandbox image so the first docker-gated test
      # doesn't pay the multi-minute ensureImage() build cost during
      # the test window.
      - name: Pre-build sandbox image
        run: docker build -t agenta-sandbox:latest sandbox/

      # Clone the botspace for the in-process agent's buildSystemPrompt.
      # Locally this comes from the dev's .env (AGENTA_REPO_PATH=…/agenta-botspace);
      # CI needs an explicit clone.
      - name: Clone botspace
        env:
          BOTSPACE_TOKEN: ${{ secrets.BOTSPACE_READ_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${BOTSPACE_TOKEN}@github.com/eladb/agenta-test-home.git" \
            "${RUNNER_TEMP}/botspace"
          echo "AGENTA_REPO_PATH=${RUNNER_TEMP}/botspace" >> "$GITHUB_ENV"

      - name: E2E
        env:
          # Dedicated CI Slack app — see header comment for why.
          SLACK_APP_TOKEN: ${{ secrets.CI_SLACK_APP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.CI_SLACK_BOT_TOKEN }}
          TEST_APP_TOKEN: ${{ secrets.TEST_APP_TOKEN }}
          TEST_BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          # Docker-gated tests run here; Fly-gated tests skip cleanly
          # because no FLY_API_TOKEN is set in this step.
          SANDBOX_PROVIDER: docker
          # Match what the egress test asserts. Phase 21 (#21) flipped the
          # default to `allow` for dev ergonomics; CI exercises the
          # production-hardened `block` config so the assertion holds.
          SANDBOX_EGRESS: block
        run: bun run e2e

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to production
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: bun run deploy

      # Canary uses the production agent's bot token only to resolve the
      # prod agent's user id (no Socket Mode client is connected to it).
      # The tester drives the conversation via TEST_APP_TOKEN/TEST_BOT_TOKEN.
      - name: Canary (production)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TEST_APP_TOKEN: ${{ secrets.TEST_APP_TOKEN }}
          TEST_BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}
          TEST_CHANNEL_ID: ${{ secrets.CANARY_CHANNEL_ID }}
        run: bun run canary
